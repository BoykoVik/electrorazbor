{% load static %}
<header>
  <script src="{% static 'js/vendor/jquery-3.6.0.min.js' %}"></script>
  
  {# Верхняя панель #}
  {% include "layout/header-top.html" %}
  
  {# Десктопная версия #}
  <div class="header-bottom d-none d-lg-block">
    <div class="container">
      <div class="row justify-content-between align-items-center">
        <div class="col-lg-3 col">
          <div class="header-logo">
            <a href="{% url 'coreapp:home' %}" aria-label="Electrorazbor.ru - главная">
              <img src="{% static 'ELR1.png' %}" alt="Electrorazbor.ru - запчасти для электросамокатов" width="300" height="auto" loading="lazy">
            </a>
          </div>
        </div>
        <div class="col-lg-6 d-none d-lg-block">
          <div class="search-element" role="search">
            <form action="{% url 'coreapp:search' %}" method="get">
              <input type="text" name="query" placeholder="Поиск запчастей..." aria-label="Поиск по сайту">
              <button type="submit" aria-label="Найти"><i class="pe-7s-search"></i></button>
            </form>
          </div>
        </div>
        <div class="col-lg-3 col">
          <div class="header-actions">
            <a href="#offcanvas-cart" class="header-action-btn header-action-btn-cart offcanvas-toggle pr-0" aria-label="Корзина">
              <i class="pe-7s-shopbag"></i>
              <span class="header-action-num" aria-hidden="true">0</span>
            </a>
            <a href="#offcanvas-mobile-menu" class="header-action-btn header-action-btn-menu offcanvas-toggle d-lg-none" aria-label="Меню">
              <i class="pe-7s-menu"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  {# Мобильная версия #}
  <div class="header-bottom d-lg-none sticky-nav style-1">
    <div class="container">
      <div class="row justify-content-between align-items-center">
        <div class="col-8 col-sm-9">
          <div class="header-logo">
            <a href="{% url 'coreapp:home' %}" aria-label="Electrorazbor.ru - главная">
              <img src="{% static 'ELR1.png' %}" alt="Electrorazbor.ru" width="200" height="auto" loading="lazy">
            </a>
          </div>
        </div>
        <div class="col-4 col-sm-3">
          <div class="header-actions d-flex justify-content-end">
            <a href="#offcanvas-cart" class="header-action-btn header-action-btn-cart offcanvas-toggle pr-0" aria-label="Корзина">
              <i class="pe-7s-shopbag"></i>
              <span class="header-action-num" aria-hidden="true">0</span>
            </a>
            <a href="#offcanvas-mobile-menu" class="header-action-btn header-action-btn-menu offcanvas-toggle" aria-label="Меню">
              <i class="pe-7s-menu"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  {# Навигационное меню #}
  <div class="header-nav-area d-none d-lg-block sticky-nav">
    <div class="container">
      <div class="header-nav">
        <nav class="main-menu position-relative" aria-label="Основное меню">
          <ul itemscope itemtype="https://schema.org/SiteNavigationElement">
            {% include "layout/menu.html" %}
          </ul>
        </nav>
      </div>
    </div>
  </div>
  
  {# Мобильный поиск #}
  <div class="mobile-search-box d-lg-none">
    <div class="container">
      <div class="search-element max-width-100" role="search">
        <form action="{% url 'coreapp:search' %}" method="get">
          <input type="text" name="query" placeholder="Поиск запчастей..." aria-label="Поиск по сайту">
          <button type="submit" aria-label="Найти"><i class="pe-7s-search"></i></button>
        </form>
      </div>
    </div>
  </div>
</header>

{% include "layout/cart.html" %}
