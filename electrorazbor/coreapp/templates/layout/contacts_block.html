{% load static %}
<section class="container mb-30px" aria-label="Контакты" itemscope itemtype="https://schema.org/ContactPoint">
  <div class="blog-post-content-inner mt-30px">
    <h2 class="blog-title">Контакты</h2>
  </div>
  <div class="row">
    <div class="col-md-6">
      <div itemprop="address" itemscope itemtype="https://schema.org/PostalAddress">
        <script type="text/javascript" charset="utf-8" async 
          src="https://api-maps.yandex.ru/services/constructor/1.0/js/?um=constructor%3A2d147697b077f1a6b28f9a3e5a9159b1ac7e78c7b38f33b9a99c6f41693a409a&amp;width=100%&amp;height=400&amp;lang=ru_RU&amp;scroll=true">
        </script>
      </div>
    </div>
    <div class="col-md-6" style="display: flex; flex-direction: column; justify-content: space-evenly;">
      {% for contact in contacts %}
        <a href="{{ contact.link }}" style="color: black; padding-top: 20px;" 
           itemprop="telephone" {% if 'wa' in contact.code %}rel="nofollow noopener" target="_blank"{% endif %}>
          <i class="fa {{ contact.code }}" style="color: #0d6efd; font-size: 24px; padding-right: 10px;" aria-hidden="true"></i>
          <span>{{ contact.text }}</span>
        </a>
      {% endfor %}
      <div style="color: black; padding-top: 20px;">
        <i class="fa fa-clock-o" style="color: #0d6efd; font-size: 24px; padding-right: 10px;" aria-hidden="true"></i>
        <span>Время работы: с 10:00 до 20:00</span>
      </div>
      <div style="color: black; padding-top: 20px;" itemprop="address" itemscope itemtype="https://schema.org/PostalAddress">
        <i class="fa fa-home" style="color: #0d6efd; font-size: 24px; padding-right: 10px;" aria-hidden="true"></i>
        <span itemprop="streetAddress">г. Москва, ул. 2-я Фрунзенская д. 10, корп. 2</span>
      </div>
    </div>
  </div>
</section>
